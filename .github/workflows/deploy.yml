name: Deploy to VPS

# Optional CD job: SSHes into the VPS, pulls latest, and rebuilds the
# shared MySQL + ML server stack. Disabled until the secrets below are
# set under Settings -> Secrets and variables -> Actions:
#
#   VPS_HOST         (e.g. 159.195.147.132)
#   VPS_USER         (e.g. root)
#   VPS_SSH_KEY      (contents of an OpenSSH private key — see README)
#
# Once secrets exist, change the `if:` below to `true`.

on:
  push:
    branches: [Dev]
  workflow_dispatch:

jobs:
  deploy:
    if: true
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and rebuild on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            cd ~/SEP4
            git pull --ff-only
            cd System
            docker compose -f docker-compose.vps.yml up -d --build
            docker image prune -f
          EOF
