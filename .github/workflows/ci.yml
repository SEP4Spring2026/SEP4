name: CI

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]

jobs:
  mainserver:
    name: MainServer (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore System/MainServer.Tests/MainServer.Tests.csproj

      - name: Build
        run: dotnet build System/MainServer.Tests/MainServer.Tests.csproj --configuration Release --no-restore

      - name: Test + coverage
        run: >
          dotnet test System/MainServer.Tests/MainServer.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/

  mlserver:
    name: MlServer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: System/MlServer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: System/MlServer/requirements*.txt

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test + coverage
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: System/MlServer/coverage.xml

  docker:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build MainServer image
        uses: docker/build-push-action@v6
        with:
          context: System/MainServer
          push: false
          tags: kamtjatka/main-server:ci

      - name: Build MlServer image
        uses: docker/build-push-action@v6
        with:
          context: System/MlServer
          push: false
          tags: kamtjatka/ml-server:ci
