services:
  main-server:
    build: ./MainServer
    image: kamtjatka/main-server:latest
    container_name: kamtjatka-main
    restart: unless-stopped
    ports:
      - "${MAIN_SERVER_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ML_SERVER_URL: ${ML_SERVER_URL}

  frontend:
    build: ../FrontEnd/SEP4FrontEnd
    image: kamtjatka/frontend:latest
    container_name: kamtjatka-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
