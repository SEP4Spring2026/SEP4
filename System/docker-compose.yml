services:
  main-server:
    build: ./MainServer
    image: kamtjatka/main-server:latest
    container_name: kamtjatka-main
    restart: unless-stopped
    ports:
      - "${MAIN_SERVER_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: "Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD}"
      MlServer__Url: ${ML_SERVER_URL}
