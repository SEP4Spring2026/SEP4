# VPS-side deployment: shared MySQL + shared ML server + main server.
# Deploy on the VPS:
#   docker compose -f docker-compose.vps.yml up -d --build
#
# Dev laptops do NOT use this file — they run the default
# docker-compose.yml (main-server only) and connect here via the
# public IP set in DB_HOST / ML_SERVER_URL.

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: kamtjatka-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

  mqtt-http-bridge:
    build: ./IoT_foundation/devops/mqtt_http_bridge
    container_name: kamtjatka-mqtt-http-bridge
    restart: unless-stopped
    depends_on:
      - mqtt-broker
      - main-server
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC: iot/readings
      BACKEND_URL: http://main-server:8080/api/readings

  main-server:
    build: ./MainServer
    image: kamtjatka/main-server:latest
    container_name: kamtjatka-main
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml-server:
        condition: service_healthy
    ports:
      - "${MAIN_SERVER_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Inside the compose network we reach the other services by name,
      # so these are hardcoded rather than read from .env.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ML_SERVER_URL: http://ml-server:8000


  mysql:
    image: mysql:8
    container_name: kamtjatka-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Public: dev laptops connect over the internet. The strong
      # DB_PASSWORD is the primary defense — keep it secret and
      # rotate it if it ever leaks.
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  ml-server:
    build: ./MlServer
    image: kamtjatka/ml-server:latest
    container_name: kamtjatka-ml
    restart: unless-stopped
    ports:
      - "${ML_SERVER_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
  mqtt-data:
  mqtt-log:
